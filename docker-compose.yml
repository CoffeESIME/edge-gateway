services:
  scada-edge:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: scada-edge-${EDGE_ID:-default}

    restart: unless-stopped

    environment:
      - EDGE_ID=${EDGE_ID:-edge_planta_norte_01}

      - MQTT_BROKER_IP=${MQTT_BROKER_IP:-192.168.1.100}
      - MQTT_PORT=${MQTT_PORT:-8883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_KEEPALIVE=${MQTT_KEEPALIVE:-60}

      - MQTT_USE_TLS=${MQTT_USE_TLS:-true}
      - CERT_CA_PATH=/certs/ca.crt
      - CERT_CLIENT_PATH=/certs/edge_device.crt
      - CERT_KEY_PATH=/certs/edge_device.key

      - DB_PATH=/data/edge_db.sqlite

      - POLL_RELOAD_INTERVAL_S=${POLL_RELOAD_INTERVAL_S:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    volumes:
      - ./certs:/certs:ro
      - ./data:/data
    network_mode: host

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
